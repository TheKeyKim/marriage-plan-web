<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리 결혼 준비 체크리스트 💍</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <h1>우리 결혼 준비 체크리스트</h1>
        <p class="couple" id="coupleLine">신랑 · 신부</p>
      </div>
      <div class="countdown">
        <span class="d-day" id="dday">D-—</span>
        <span class="d-date" id="ddate">예식일</span>
      </div>
    </div>
  </header>

  <!-- 슬림 요약 바 -->
  <section class="statbar">
    <div class="stat"><span class="lbl">예상 총액</span><b class="val" id="sumTotal">0원</b></div>
    <div class="sep"></div>
    <div class="stat"><span class="lbl">💰 낸 돈</span><b class="val paid" id="sumPaid">0원</b></div>
    <div class="sep"></div>
    <div class="stat"><span class="lbl">🧾 앞으로 낼 돈</span><b class="val todo" id="sumTodo">0원</b></div>
    <div class="sep"></div>
    <div class="stat"><span class="lbl">필수 완료</span><b class="val" id="sumRequired">0 / 0</b></div>
    <div class="sep"></div>
    <div class="stat grow">
      <span class="lbl">전체 진행률 <span id="progressText">0%</span></span>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>
  </section>
  <p class="unknown-note" id="sumUnknown"></p>

  <!-- 컨트롤: 화면 전환 + 유틸리티 -->
  <div class="controls">
    <div class="view-toggle" id="viewToggle">
      <button class="chip active" data-view="overview">🪟 한눈에 보기</button>
      <button class="chip" data-view="table">📋 상세 표</button>
    </div>
    <div class="ctl-right">
      <span class="sync-badge" id="syncBadge"></span>
      <span class="file-status" id="fileStatus"></span>
      <button class="btn sm" id="undoBtn" disabled>↩︎ 되돌리기</button>
      <button class="btn sm" id="openFileBtn">📂 열기</button>
      <button class="btn sm" id="saveFileBtn">💾 저장</button>
      <button class="btn sm" id="settingsBtn">⚙ 설정</button>
      <button class="btn sm btn-ghost" id="resetBtn">초기화</button>
      <input type="file" id="importFile" accept="application/json" hidden />
    </div>
  </div>

  <!-- 분류 필터 -->
  <div class="cat-chips" id="catChips"><!-- 분류 칩 --></div>

  <!-- 개요(한눈에 보기) -->
  <section class="overview" id="overview"><!-- 렌더링 --></section>

  <!-- 상세 표 -->
  <div class="table-panel" id="tableView" hidden>
    <button class="add-row top" data-add>＋ 행 추가</button>
    <div class="table-scroll">
      <table>
        <thead>
          <tr id="head">
            <th data-key="done">✔</th>
            <th data-key="type">구분 <span class="arrow"></span></th>
            <th data-key="category">분류 <span class="arrow"></span></th>
            <th data-key="item">항목 <span class="arrow"></span></th>
            <th data-key="opt">선택지 / 업체 <span class="arrow"></span></th>
            <th data-key="price" class="num">금액 <span class="arrow"></span></th>
            <th data-key="deposit" class="num">계약금 <span class="arrow"></span></th>
            <th data-key="status">상태 <span class="arrow"></span></th>
            <th data-key="memo">비고 <span class="arrow"></span></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <button class="add-row" data-add>＋ 행 추가</button>
  </div>

  <footer class="app-footer">
    <p>변경사항은 이 브라우저에 자동 저장됩니다. <b>💾 저장</b>으로 JSON 파일에도 실시간 기록할 수 있어요.</p>
    <p class="muted">한국 결혼 준비 체크리스트 템플릿 · 개인정보는 저장되지 않습니다</p>
  </footer>

  <!-- 설정 모달 -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <h3>설정</h3>
      <section class="set-sec">
        <h4>💒 예식 정보</h4>
        <div class="set-grid">
          <label>신랑<input type="text" id="setGroom" placeholder="신랑 이름"></label>
          <label>신부<input type="text" id="setBride" placeholder="신부 이름"></label>
          <label>예식일<input type="datetime-local" id="setDate"></label>
          <label>예식장<input type="text" id="setVenue" placeholder="예식장"></label>
        </div>
      </section>
      <section class="set-sec">
        <h4>☁ GitHub 동기화 (JSON 저장)</h4>
        <label class="set-full">저장소 링크<input type="text" id="setRepo" placeholder="https://github.com/사용자/레포"></label>
        <label class="set-full">JSON 경로<input type="text" id="setPath" placeholder="data/plan.json"></label>
        <label class="set-full">액세스 토큰 (PAT)<input type="password" id="setToken" placeholder="github_pat_..." autocomplete="off"></label>
        <p class="set-hint">토큰은 이 브라우저에만 저장됩니다 · <a id="patLink" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">토큰 만들기 ↗</a> · 상태: <span id="syncState">미연결</span></p>
      </section>
      <div class="modal-actions">
        <button class="btn" id="setPull">↓ 원격 불러오기</button>
        <span class="spacer"></span>
        <button class="btn" id="setCancel">닫기</button>
        <button class="btn btn-primary" id="setSave">저장 &amp; 연결</button>
      </div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/github-sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
